name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            prepare: true
         
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Prepare datatool (linux only)
        if: matrix.prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar
          make prepare

      - name: Test
        run: go test ./...

      - name: Build
              shell: bash
              env:
                CGO_ENABLED: "1"
                GOOS: ${{ matrix.goos }}
                GOARCH: ${{ matrix.goarch }}
              run: |
                VERSION="${GITHUB_REF_NAME}"
                DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if [ "${{ matrix.goos }}" = "linux" ]; then
                  go build \
                    -ldflags="-s -w -extldflags '-static' -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}" \
                    -o tdx2db${{ matrix.ext }} ./main.go
                else
                  go build \
                    -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}" \
                    -o tdx2db${{ matrix.ext }} ./main.go
                fi

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tdx2db${{ matrix.ext }}
          retention-days: 7
