name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            os_title: Linux
            arch_title: x86_64
            ext: ""
            prepare: true

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Prepare datatool (linux only)
        if: matrix.prepare
        run: |
          sudo apt-get update
          # 优化：顺便安装 build-essential 和 g++，确保 CGO 静态链接所需的 libc.a/libm.a 完整
          sudo apt-get install -y unrar build-essential g++
          make prepare

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1" # 关键：必须保持 1 以兼容 DuckDB 驱动
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          # 核心优化：如果是 Linux 系统，强制注入 -extldflags '-static' 实现静态编译，剥离 GLIBC 高版本依赖
          if [ "${{ matrix.goos }}" = "linux" ]; then
            go build \
              -ldflags="-s -w -extldflags '-static' -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}" \
              -o tdx2db${{ matrix.ext }} ./main.go
          else
            go build \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}" \
              -o tdx2db${{ matrix.ext }} ./main.go
          fi

      - name: Archive (tar.gz)
        shell: bash
        run: |
          NAME="tdx2db_${{ matrix.os_title }}_${{ matrix.arch_title }}"
          tar -czf "${NAME}.tar.gz" tdx2db${{ matrix.ext }}

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tdx2db_*.*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          pattern: archive-*
          merge-multiple: true

      - name: Determine pre-release
        id: prerel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            archives/tdx2db_*.* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${{ steps.prerel.outputs.flag }}
